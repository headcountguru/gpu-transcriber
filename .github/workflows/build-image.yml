name: Build image

# Manual runs and image-* tags only; never on every push.
on:
  workflow_dispatch:
  push:
    tags:
      - "image-*"

# Least privilege: read the repo, push the package. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      # Third-party actions are pinned to major version tags for now; pinning to full commit SHAs
      # is a later hardening step.

      - name: Free disk space
        # The CUDA/torch image plus the loaded copy needs more than the default free space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4 # TODO: pin to a full commit SHA

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # TODO: pin to a full commit SHA

      - name: Log in to ghcr.io
        uses: docker/login-action@v3 # TODO: pin to a full commit SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          GIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/gpu-transcriber"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:sha-${GIT_SHA}"
            if [ "${REF_TYPE}" = "tag" ]; then echo "${image}:${REF_NAME}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (local only)
        uses: docker/build-push-action@v6 # TODO: pin to a full commit SHA
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:ci

      - name: Set up Python
        uses: actions/setup-python@v5 # TODO: pin to a full commit SHA
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest

      - name: Image contract test
        env:
          GPU_TRANSCRIBER_TEST_IMAGE: ${{ steps.meta.outputs.image }}:ci
        run: python -m pytest tests/test_image_contract.py -m integration -v

      - name: Capture pip freeze
        env:
          IMAGE_CI: ${{ steps.meta.outputs.image }}:ci
        run: docker run --rm "${IMAGE_CI}" python -m pip freeze > pip-freeze.txt

      - name: Upload pip freeze
        uses: actions/upload-artifact@v4 # TODO: pin to a full commit SHA
        with:
          name: pip-freeze
          path: pip-freeze.txt

      # Only reached when every step above (including the contract test) succeeded.
      - name: Push image
        id: push
        uses: docker/build-push-action@v6 # TODO: pin to a full commit SHA
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Summarize digest and size
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          size_bytes=$(docker image inspect "${IMAGE}:ci" --format '{{.Size}}')
          {
            echo "## Image published"
            echo
            echo "Digest reference (put this in app/settings.py IMAGE):"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Uncompressed size: $((size_bytes / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
