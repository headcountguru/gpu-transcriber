name: Build image

# Manual runs and image-* tags only; never on every push.
on:
  workflow_dispatch:
  push:
    tags:
      - "image-*"

# Least privilege: read the repo, push the package. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      # Third-party actions are pinned to major version tags for now; pinning to full commit SHAs
      # is a later hardening step.

      - name: Free disk space
        # The CUDA/torch image plus the loaded copy needs more than the default free space.
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4 # TODO: pin to a full commit SHA
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # TODO: pin to a full commit SHA

      - name: Log in to ghcr.io
        uses: docker/login-action@v3 # TODO: pin to a full commit SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          GIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/gpu-transcriber"
          tags="sha-${GIT_SHA}"
          if [ "${REF_TYPE}" = "tag" ]; then
            if ! printf '%s' "${REF_NAME}" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
              echo "::error::Git tag name is not a valid Docker tag (allowed: A-Za-z0-9_.- , 1-128 chars)"
              exit 1
            fi
            tags="${tags} ${REF_NAME}"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (local only)
        uses: docker/build-push-action@v6 # TODO: pin to a full commit SHA
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:ci

      - name: Set up Python
        uses: actions/setup-python@v5 # TODO: pin to a full commit SHA
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest

      - name: Image contract test
        env:
          GPU_TRANSCRIBER_TEST_IMAGE: ${{ steps.meta.outputs.image }}:ci
        shell: bash
        run: |
          set -euo pipefail
          # pipefail makes a failing pytest fail the step even though tee succeeds. pytest exits 0
          # when every test is skipped, so also fail explicitly on any skip, failure or error (the
          # test module also fails instead of skipping when CI is set).
          python -m pytest tests/test_image_contract.py -m integration -v -rs | tee contract.log
          if grep -Eq '(^SKIPPED|[0-9]+ skipped)' contract.log; then
            echo "::error::Contract tests were skipped; the image was not tested"
            exit 1
          fi
          if grep -Eq '[0-9]+ (failed|error)' contract.log; then
            echo "::error::Contract tests reported failures or errors"
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' contract.log; then
            echo "::error::No contract tests passed"
            exit 1
          fi

      - name: Capture pip freeze
        env:
          IMAGE_CI: ${{ steps.meta.outputs.image }}:ci
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_CI}" python -m pip freeze > pip-freeze.txt

      - name: Upload pip freeze
        uses: actions/upload-artifact@v4 # TODO: pin to a full commit SHA
        with:
          name: pip-freeze
          path: pip-freeze.txt

      # Only reached when every step above (including the contract test) succeeded. Pushes the exact
      # :ci image that was tested (retagged), never a rebuild.
      - name: Push the tested image
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          first=""
          for tag in ${TAGS}; do
            docker tag "${IMAGE}:ci" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
            if [ -z "${first}" ]; then first="${tag}"; fi
          done
          ref=$(docker image inspect "${IMAGE}:${first}" --format '{{index .RepoDigests 0}}')
          echo "digest_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Summarize digest and size
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        shell: bash
        run: |
          set -euo pipefail
          size_bytes=$(docker image inspect "${IMAGE}:ci" --format '{{.Size}}')
          {
            echo "## Image published"
            echo
            echo "Digest reference (put this in app/settings.py IMAGE):"
            echo
            echo '```'
            echo "${DIGEST_REF}"
            echo '```'
            echo
            echo "Uncompressed size: $((size_bytes / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
